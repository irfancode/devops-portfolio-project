stages:
  - lint
  - test
  - build
  - security-scan
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/flask-api"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  AWS_REGION: "us-east-1"
  TERRAFORM_DIR: "terraform/environments"

.lint-base:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black isort
  script:
    - black --check api/
    - isort --check-only api/
    - flake8 api/ --max-line-length=120 --exclude=__init__.py

lint:api:
  extends: .lint-base
  rules:
    - changes:
        - api/**/*.py

lint:terraform:
  stage: lint
  image: hashicorp/terraform:latest
  script:
    - cd $TERRAFORM_DIR/dev
    - terraform init -backend=false
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - changes:
        - terraform/**/*.tf

test:api:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r api/requirements.txt
    - pip install pytest pytest-cov
  script:
    - cd api
    - pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml
    when: always
  rules:
    - changes:
        - api/**/*.py

build:docker:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t "$DOCKER_IMAGE:$DOCKER_TAG" -t "$DOCKER_IMAGE:latest" api/
    - docker push "$DOCKER_IMAGE:$DOCKER_TAG"
    - docker push "$DOCKER_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

security:container-scan:
  stage: security-scan
  image: aquasec/trivy:latest
  before_script:
    - docker pull "$DOCKER_IMAGE:$DOCKER_TAG" || true
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$DOCKER_IMAGE:$DOCKER_TAG" || exit 1
    - trivy image --format table "$DOCKER_IMAGE:$DOCKER_TAG"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

security:dependency-scan:
  stage: security-scan
  image: python:3.11-slim
  before_script:
    - pip install safety
  script:
    - cd api
    - safety check -r requirements.txt --json
  allow_failure: true
  rules:
    - changes:
        - api/requirements.txt

deploy:dev:
  stage: deploy-dev
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to development environment"
    - |
      curl -X POST "$DEV_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{\"image\": \"$DOCKER_IMAGE:$DOCKER_TAG\", \"environment\": \"dev\"}"
  environment:
    name: development
    url: https://dev-api.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment"
    - |
      curl -X POST "$STAGING_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{\"image\": \"$DOCKER_IMAGE:$DOCKER_TAG\", \"environment\": \"staging\"}"
  environment:
    name: staging
    url: https://staging-api.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:production:
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production environment"
    - |
      curl -X POST "$PROD_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{\"image\": \"$DOCKER_IMAGE:$DOCKER_TAG\", \"environment\": \"prod\"}"
  environment:
    name: production
    url: https://api.example.com
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  when: manual

terraform:plan:
  stage: deploy-dev
  image: hashicorp/terraform:latest
  script:
    - cd $TERRAFORM_DIR/dev
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TERRAFORM_DIR/dev/tfplan
    expire_in: 1 hour
  rules:
    - changes:
        - terraform/**/*.tf
      when: manual

terraform:apply:
  stage: deploy-staging
  image: hashicorp/terraform:latest
  script:
    - cd $TERRAFORM_DIR/dev
    - terraform init
    - terraform apply -auto-approve tfplan
  rules:
    - changes:
        - terraform/**/*..tf
      when: manual
  needs:
    - job: terraform:plan
      artifacts: true
